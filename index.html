<div id="bg"><div class="bg-wall"></div><div class="bg-art"><img alt=""></div><div class="bg-a"></div><div class="bg-b"></div><div class="bg-c"></div><div class="bg-vignette"></div><div class="bg-noise"></div></div>

<div id="app">
  <header id="titlebar">
    <div class="tb-left">
      <button class="ib" id="btnSide" title="Toggle sidebar (Ctrl+B)"><svg><use href="#i-sidebar"/></svg></button>
      <button class="ib" id="navBack" title="Back"><svg><use href="#i-back"/></svg></button>
      <button class="ib" id="navFwd" title="Forward"><svg><use href="#i-fwd"/></svg></button>
    </div>
    <div class="tb-drag" id="dragZone"></div>
    <label class="tb-search" id="topSearch">
      <svg><use href="#i-search"/></svg>
      <input id="searchInput" placeholder="Search songs, albums, artists…" autocomplete="off" spellcheck="false">
      <kbd>Ctrl K</kbd>
    </label>
    <div class="tb-drag"></div>
    <div class="tb-right">
      <div id="scanPill" class="scan-pill hidden"><span class="spin"></span><span class="txt"></span></div>
      <button class="ib" id="btnSettings" title="Settings (Ctrl+,)"><svg><use href="#i-gear"/></svg></button>
      <div class="winbtns">
        <button class="wb" id="wMin" title="Minimize"><svg><use href="#i-wmin"/></svg></button>
        <button class="wb" id="wMax" title="Maximize"><svg><use href="#i-wmax"/></svg></button>
        <button class="wb close" id="wClose" title="Close"><svg><use href="#i-x"/></svg></button>
      </div>
    </div>
  </header>

  <aside id="side">
    <nav class="side-nav">
      <a data-go="home"><svg><use href="#i-home"/></svg><span>Home</span></a>
      <a data-go="search"><svg><use href="#i-search"/></svg><span>Search</span></a>
    </nav>
    <div class="side-lib">
      <div class="side-head">
        <a data-go="library" class="side-title"><svg><use href="#i-library"/></svg><span>Your Library</span></a>
        <button class="ib sm" id="sideNew" title="Create playlist or folder"><svg><use href="#i-plus"/></svg></button>
      </div>
      <div class="side-chips">
        <a data-go="songs"><svg><use href="#i-note"/></svg><span>Songs</span></a>
        <a data-go="albums"><svg><use href="#i-album"/></svg><span>Albums</span></a>
        <a data-go="artists"><svg><use href="#i-artist"/></svg><span>Artists</span></a>
        <a data-go="folders"><svg><use href="#i-folder"/></svg><span>Folders</span></a>
      </div>
      <div class="side-scroll">
        <a class="side-item special" data-go="liked"><span class="sw liked"><svg><use href="#i-heart-f"/></svg></span><span class="t"><b>Liked Songs</b><small id="likedCount"></small></span></a>
        <a class="side-item special" data-go="recent"><span class="sw recent"><svg><use href="#i-clock"/></svg></span><span class="t"><b>Recently Played</b><small>Your history</small></span></a>
        <div id="tree" class="tree"></div>
      </div>
    </div>
  </aside>

  <main id="main"><div id="view"></div></main>

  <aside id="panel">
    <div class="panel-tabs">
      <button data-ptab="queue" class="on">Queue</button>
      <button data-ptab="lyrics">Lyrics</button>
      <button data-ptab="info">Info</button>
      <button class="ib sm" id="panelClose"><svg><use href="#i-x"/></svg></button>
    </div>
    <div id="panelBody"></div>
  </aside>

  <footer id="bar">
    <div class="bar-left">
      <div class="bar-art" id="barArt" title="Open Now Playing"><img alt=""><div class="art-fallback"><svg><use href="#i-note"/></svg></div><span class="art-expand"><svg><use href="#i-up"/></svg></span></div>
      <div class="bar-meta"><div class="marq"><a class="bar-title" id="barTitle">Nothing playing</a></div><a class="bar-artist" id="barArtist">Pick a song to get started</a></div>
      <button class="ib like" id="barLike" title="Like (L)"><svg><use href="#i-heart"/></svg></button>
    </div>
    <div class="bar-center">
      <div class="controls">
        <button class="ib mode" id="cShuffle" title="Shuffle (S)"><svg><use href="#i-shuffle"/></svg></button>
        <button class="ib" id="cPrev" title="Previous (Shift+←)"><svg><use href="#i-prev"/></svg></button>
        <button class="pp" id="cPlay" title="Play/Pause (Space)"><svg class="i-play"><use href="#i-play"/></svg><svg class="i-pause"><use href="#i-pause"/></svg></button>
        <button class="ib" id="cNext" title="Next (Shift+→)"><svg><use href="#i-next"/></svg></button>
        <button class="ib mode" id="cRepeat" title="Repeat (R)"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="seek-row"><span id="tCur">0:00</span><div class="slider seek" id="seek"><div class="buf"></div><div class="fill"></div><div class="knob"></div><div class="tip"></div></div><span id="tDur">0:00</span></div>
    </div>
    <div class="bar-right">
      <button class="ib" id="bLyrics" title="Lyrics (Y)"><svg><use href="#i-lyrics"/></svg></button>
      <button class="ib" id="bQueue" title="Queue (Q)"><svg><use href="#i-queue"/></svg></button>
      <button class="ib" id="bMore" title="Sound & playback"><svg><use href="#i-eq"/></svg></button>
      <div class="vol"><button class="ib" id="bMute" title="Mute (M)"><svg><use href="#i-vol"/></svg></button><div class="slider" id="volume"><div class="fill"></div><div class="knob"></div></div></div>
      <button class="ib desk-only" id="bMini" title="Mini player (Ctrl+M)"><svg><use href="#i-mini"/></svg></button>
      <button class="ib" id="bFull" title="Now Playing (F)"><svg><use href="#i-expand"/></svg></button>
    </div>
  </footer>

  <!-- mobile -->
  <div id="mbar">
    <div class="mb-art"><img alt=""><div class="art-fallback"><svg><use href="#i-note"/></svg></div></div>
    <div class="mb-meta"><b id="mbTitle">Nothing playing</b><small id="mbArtist">Import some music</small></div>
    <button class="ib like" id="mbLike"><svg><use href="#i-heart"/></svg></button>
    <button class="ib mb-pp" id="mbPlay"><svg class="i-play"><use href="#i-play"/></svg><svg class="i-pause"><use href="#i-pause"/></svg></button>
    <div class="mb-prog"><div></div></div>
  </div>
  <nav id="tabs">
    <a data-go="home"><svg><use href="#i-home"/></svg><span>Home</span></a>
    <a data-go="search"><svg><use href="#i-search"/></svg><span>Search</span></a>
    <a data-go="library"><svg><use href="#i-library"/></svg><span>Library</span></a>
    <a data-go="settings"><svg><use href="#i-gear"/></svg><span>Settings</span></a>
  </nav>
</div>

<!-- Now playing -->
<section id="np" aria-hidden="true">
  <div class="np-bg"><img class="b1" alt=""><img class="b2" alt=""><div class="np-shade"></div></div>
  <canvas id="viz"></canvas>
  <div class="np-top">
    <button class="ib" id="npClose" title="Close (Esc)"><svg><use href="#i-down"/></svg></button>
    <div class="np-src"><small>Playing from</small><b id="npSource">Your library</b></div>
    <button class="ib" id="npMore"><svg><use href="#i-more"/></svg></button>
  </div>
  <div class="np-body">
    <div class="np-left">
      <div class="np-art" id="npArt"><div class="np-art-inner"><img alt=""><div class="art-fallback"><svg><use href="#i-note"/></svg></div><div class="np-shine"></div></div></div>
      <div class="np-meta">
        <div class="np-titles"><h1 id="npTitle">—</h1><a id="npArtist">—</a></div>
        <button class="ib like big" id="npLike"><svg><use href="#i-heart"/></svg></button>
      </div>
      <div class="seek-row np-seek"><span id="npCur">0:00</span><div class="slider seek" id="npSeekBar"><div class="buf"></div><div class="fill"></div><div class="knob"></div><div class="tip"></div></div><span id="npDur">0:00</span></div>
      <div class="controls np-controls">
        <button class="ib mode" id="npShuffle"><svg><use href="#i-shuffle"/></svg></button>
        <button class="ib xl" id="npPrev"><svg><use href="#i-prev"/></svg></button>
        <button class="pp xl" id="npPlay"><svg class="i-play"><use href="#i-play"/></svg><svg class="i-pause"><use href="#i-pause"/></svg></button>
        <button class="ib xl" id="npNext"><svg><use href="#i-next"/></svg></button>
        <button class="ib mode" id="npRepeat"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div class="np-tools">
        <button class="ib" data-np="lyrics" title="Lyrics"><svg><use href="#i-lyrics"/></svg></button>
        <button class="ib" data-np="queue" title="Queue"><svg><use href="#i-queue"/></svg></button>
        <button class="ib" data-np="viz" title="Visualizer style"><svg><use href="#i-wave"/></svg></button>
        <button class="ib" data-np="sound" title="Sound"><svg><use href="#i-eq"/></svg></button>
        <button class="ib" data-np="sleep" title="Sleep timer"><svg><use href="#i-moon"/></svg></button>
      </div>
    </div>
    <div class="np-right" id="npRight"></div>
  </div>
</section>

<!-- Mini player (desktop) -->
<section id="mini" class="miniplayer l-bar">
  <div class="mini-bg"><img alt=""></div>
  <div class="mini-glass"></div>
  <div class="mini-drag" id="miniDrag"></div>
  <div class="mini-content">
    <div class="mini-art"><img alt=""><div class="art-fallback"><svg><use href="#i-note"/></svg></div></div>
    <div class="mini-meta"><div class="marq"><b id="miniTitle">—</b></div><small id="miniArtist">—</small></div>
    <div class="mini-ctl">
      <button class="ib like" data-m="like" title="Like"><svg><use href="#i-heart"/></svg></button>
      <button class="ib" data-m="prev" title="Previous"><svg><use href="#i-prev"/></svg></button>
      <button class="pp" data-m="play" title="Play / pause"><svg class="i-play"><use href="#i-play"/></svg><svg class="i-pause"><use href="#i-pause"/></svg></button>
      <button class="ib" data-m="next" title="Next"><svg><use href="#i-next"/></svg></button>
    </div>
    <div class="mini-prog"><div class="slider seek" id="miniSeek"><div class="fill"></div><div class="knob"></div></div><div class="mini-times"><span id="miniCur">0:00</span><span id="miniDur">0:00</span></div></div>
    <div class="mini-extra">
      <button class="ib mode" data-m="shuffle" title="Shuffle"><svg><use href="#i-shuffle"/></svg></button>
      <button class="ib mode" data-m="repeat" title="Repeat"><svg><use href="#i-repeat"/></svg></button>
      <button class="ib" data-m="mute" title="Mute"><svg><use href="#i-vol"/></svg></button>
      <div class="slider" id="miniVol"><div class="fill"></div><div class="knob"></div></div>
    </div>
  </div>
  <div class="mini-hover">
    <button class="ib trig" title="Options"><svg><use href="#i-more"/></svg></button>
    <div class="mh-items">
      <button class="ib" data-m="layout" title="Change layout"><svg><use href="#i-layers"/></svg></button>
      <button class="ib" data-m="custom" title="Customize"><svg><use href="#i-palette"/></svg></button>
      <button class="ib" data-m="pin" title="Always on top"><svg><use href="#i-pin"/></svg></button>
      <button class="ib" data-m="exit" title="Back to full player"><svg><use href="#i-expand"/></svg></button>
    </div>
  </div>
</section>

<div id="grips"><div class="g r" data-g="r"></div><div class="g b" data-g="b"></div><div class="g br" data-g="br"></div></div>
<div id="layer"></div>
<div id="toasts"></div>
<div id="boot"><div class="boot-logo"><span></span><span></span><span></span><span></span></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
